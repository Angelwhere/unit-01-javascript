 <script>

let first = clean.slice(0, space); // 3. cut out the first name
let last = clean.slice(space + 1); // 4. cut out the last name
first = first.charAt(0).toUpperCase() + first.slice(1); // 5. capitalize each one
last = last.charAt(0).toUpperCase() + last.slice(1);
