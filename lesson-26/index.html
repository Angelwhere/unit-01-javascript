<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Controls</title>
        <style>
          .card { border: 2px solid purple; padding: 8px; width: 200px; margin: 6px 0; }

          #player { position: relative; width: 40px; height: 40px; background-color: purple; }
        </style>
      </head>
      <body>
        <h1>Arcade Controls</h1>

        <div class="card game">Pinball</div>
        <div class="card game">Air Hockey</div>
        <div class="card game">Skee-Ball</div>
        <h2>High Scores</h2>
        <ul id="highScores"></ul>
        <div id="player"></div>
<script>
 let score = 0;
    let x = 0;
    let scoreText = document.getElementById("score");
    let player = document.getElementById("player");
    let topScores = ["Ana: 42", "Kai: 37", "Zoe: 30"];
 
    // Your code goes here
//core 1
 function addPoint(){
  score+= 1;
  scoreText.textcontent = "Score:" + score;
 }
document.getElementById("point").addEventListener("click", addPoint);

 //core 2
 function resetScore(){
  score=0;
  scoreText.textContent= "score: 0";
 }
 document.getElementById("reset").addEventListener("click", addPoint);

 function showHelp(){

 }
