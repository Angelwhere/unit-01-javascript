// ----- CORE -----
// Core 1: Write a constructor function named Student with three parameters:
function Student(name, grade, scores) {
  this.name = name;
  this.grade = grade;
  this.scores = scores;
  // Core 2: Inside your constructor, add a method named getHighest that RETURNS
  this.getHighest = function() {
    return Math.max(this.scores);
  }
}
// Core 3: roster with 3 students
let roster = [
new Student("Onnjel", 11, ),
new Student("Isaiah", 12, ),
new Student("Khadidia", 10, )
];

console.log(roster[1].name +  roster[1].getHighest()); // Isaiah: 93
console.log(roster[2].name + roster[2].getHighest()); // Khadidida: 88
