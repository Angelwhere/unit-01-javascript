<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Order</title>
</head>
<body>
    <h1>Pizza Order</h1>
  <form name="order">
    <p>Name: <input type="text" id="custName"> <span id="nameError"></span></p>
    <p>Quantity: <input type="text" id="qty"> <span id="qtyError"></span></p>
    <p>Promo code: <input type="text" id="promo"> <span id="promoError"></span></p>
    <p>Phone: <input type="text" id="phone"> <span id="phoneError"></span></p>
    <button type="button" id="orderBtn">Place order</button>
  </form>
  <p id="orderStatus"></p>
    <script> 
 let customName = document.getElementById("customName");
    let qty = document.getElementById("qty");
    let promo = document.getElementById("promo");
    let phone = document.getElementById("phone");
// Write your code below
// core 1: showError
function showError(id, message) {
  let el = document.getElementById(id);
  el.textContent = message;
  el.style.color = "red";
}

// core 2: checkName
function checkName() {
  if (customName.value.trim() === "") {
    showError("nameError", "Enter your name.");
    return false;
  } else {
    document.getElementById("nameError").textContent = "";
    return true;
  }
}
// core 3: checkQty
function checkQty() {
  if (qty.value.trim() === "") {
    showError("qtyError", "Enter a quantity.");
    return false;
  } else if (isNaN(qty.value)) {
    showError("qtyError", "Quantity must be a number.");
    return false;
  } else if (Number(qty.value) < 1 || Number(qty.value) > 10) {
    showError("qtyError", "Order 1 to 10 pizzas.");
    return false;
  } else {
    document.getElementById("qtyError").textContent = "";
    return true;
  }
}

// core 4: checkPromo
function checkPromo() {
  let code = promo.value.trim().toUpperCase();
  if (code === "" || code === "PIZZA5") {
    document.getElementById("promoError").textContent = "";
    return true;
  } else {
    showError("promoError", "Code not found.");
    return false;
  }
}

// Core 5: Attach blur events
customName.addEventListener("blur", checkName);
qty.addEventListener("blur", checkQty);
promo.addEventListener("blur", checkPromo);


    </script>
</body>
</html>
