<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script> 
       let choice = prompt("Enter a day number 1-7 (1=Monday, 7=Sunday):");
       let day = Number(choice); 
       if(day !==null) {
        day = day.LowerCase();
       }
       switch (day) {
  case 1:
    alert("Monday: Volleyball practice");
    break;
  case 2:
    alert("Tuesday: Chemistry tutoring");
    break;
  case 3:
    alert("Wednesday: Gym workout");
    break;
  case 4:
    alert("Thursday: Hangout with friends");
    break;
  case 5:
    alert("Friday: Movie night");
    break;
  case 6: alert("Saturday & Sunday: Time to relax and go to church");
  break;
  default:
  alert("Not a valid day of the week");


}
    </script>
</body>
</html>
