<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guessing Game</title>

    <script src="app.js"></script>
</head>
<body>
    
<script>
"use strict";
let bestScore = null;
let gamesPlayed = 0;
let wins = 0;

do {
  // S1: Difficulty - 1=Easy 10, 2=Medium 50, 3=Hard 100
  let choice = prompt("Choose difficulty: 1 (Easy), 2 (Medium), 3 (Hard)");

  let max;
  let maxAttempts;

  switch (choice) {
    case "1":
      max = 10;
      maxAttempts = 5;
      break;
    case "3":
      max = 100;
      maxAttempts = 8;
      break;
    case "2":
    default: // Any other answer plays in medium mode
      max = 50;
      maxAttempts = 7;
      break;
  }

  const MIN = 1;
  let secret = Math.floor(Math.random() * (max - MIN + 1)) + MIN;
  // console.log(secret); // testing: refresh 10x -> whole number changes

  let attempts = 0;
  let won = false;
  gamesPlayed++;

  while (attempts < maxAttempts && !won) {
    let input = prompt(`Guess a number from ${MIN} to ${max} (${maxAttempts - attempts} left):`);

    // Cancel ends game
    if (input === null) {
      alert("Game ended.");
      break;
    }

    let guess = Number(input.trim());

    // Validation - abc and 0 show error so that means it doesn't count
    if (isNaN(guess) || guess < MIN || guess > max || !Number.isInteger(guess)) {
      alert(`Please enter a number from ${MIN} to ${max}.`);
      continue;
    }

    attempts++;

    if (guess < secret) {
      alert("Too low. Try again.");
    } else if (guess > secret) {
      alert("Too high. Try again.");
    } else {
      alert(`You got it! The number was ${secret}. Attempts: ${attempts}`);
      won = true;
      wins++;

      // S4: Best score
      if (bestScore === null || attempts < bestScore) {
        bestScore = attempts;
      }
    }
  }

  // S2: Out of guesses
  if (!won && attempts >= maxAttempts) {
    alert(`Game over! The number was ${secret}.`);
  }

} while (confirm("Play again?"));

// S5: Final stats
let winPercent = gamesPlayed > 0 ? (wins / gamesPlayed * 100).toFixed(1) :"0.0";
alert(`Games played: ${gamesPlayed}\Wins: ${wins}\Win %: ${winPercent}%\Best score: ${bestScore || "none"}`);





 </script>
</body>
</html>
