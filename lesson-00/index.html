<script>
 "use strict";

    // SCENARIO 1: Game banner
    function showBanner() {
      console.log("====================");
      console.log("GUESS THE NUMBER");
      console.log("====================");
    }

    // Test showBanner()
    showBanner();
    showBanner();

    // SCENARIO 2: Name tags
    function printNameTag(name) {
      console.log(`Hello, my name is ${name}.`);
    }

    // Test printNameTag()
    printNameTag("Alice");
    printNameTag("Bob");
    printNameTag("Charlie");

    // Check Console output:

       // SCENARIO 3: Tip jar
    function calculateTip(bill, pct) {
      return bill * (pct / 100);
    }

    // Test calculateTip()
    let tip = calculateTip(80, 15);
    console.log(tip.toFixed(2));
    console.log(calculateTip(50, 20));

      // SCENARIO 4: Movie tickets
    function ticketPrice(age) {
      if (age < 13) {
        return 8;
      } else if (age >= 65) {
        return 10;
      } else {
        return 12;
      }
    }

    // Test ticketPrice()
    console.log(ticketPrice(10));
    console.log(ticketPrice(13));
    console.log(ticketPrice(30));
    console.log(ticketPrice(65));
    console.log(ticketPrice(40) + ticketPrice(40) + ticketPrice(9));

 // SCENARIO 5: Dice game
function getRandom(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function rollTwoDice() {
  let die1 = getRandom(1, 6);
  let die2 = getRandom(1, 6);
  return die1 + die2;
}

// Test: log five rolls
for (let i = 0; i < 5; i++) {
  console.log(rollTwoDice());
}
 </script>
